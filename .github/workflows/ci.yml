name: CI

on:
  push:
    branches: [main, production-v2-foundation]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXT_PUBLIC_CHECKOUT_ENABLED: 'false'
      PAYSTACK_LIVE_ENABLED: 'false'
      NEXT_PUBLIC_SUPABASE_URL: 'https://example.supabase.co'
      NEXT_PUBLIC_SUPABASE_ANON_KEY: 'sb_publishable_ci_placeholder'
      NEXT_PUBLIC_SITE_URL: 'http://localhost:3000'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Build
        run: npm run build
      - name: Start local Supabase database
        run: npx --yes supabase@2.117.0 db start
      - name: Replay migrations from scratch
        run: npx --yes supabase@2.117.0 db reset --local --no-seed
      - name: Lint database functions
        run: npx --yes supabase@2.117.0 db lint --local --level warning --fail-on error
      - name: Stop local Supabase database
        if: always()
        run: npx --yes supabase@2.117.0 stop --no-backup
      - name: Audit high severity vulnerabilities
        run: npm audit --audit-level=high
